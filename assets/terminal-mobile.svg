<svg xmlns="http://www.w3.org/2000/svg" width="640" height="902" viewBox="0 0 640 902" role="img" aria-labelledby="title desc">
  <title id="title">Andrés Araque</title>
  <desc id="desc">Major: Mathematics at UCF. Projects: Ultralearn, Hacky, Étude, Donna, content-factory, and seeko-stack. I'm Andrés, a Mathematics student at UCF building ambitious products with AI agents. My focus is agentic engineering: designing the context, tools, and verification loops that let agents deliver substantial software quickly. I care just as much about the result: a clear purpose, a restrained interface, and details that feel finished.</desc>
